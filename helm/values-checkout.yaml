image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-checkout
  pullPolicy: IfNotPresent
  tag: ""

redis:
  create: false

app:
  persistence:
    provider: redis
    redis:
      endpoint: "REPLACE_AFTER_TERRAFORM_APPLY:6379"
  endpoints:
    orders: "http://orders.retail-store.svc.cluster.local:80"

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  karpenter.sh/capacity-type: spot

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/instance: checkout
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/instance: checkout

podDisruptionBudget:
  enabled: false

opentelemetry:
  enabled: true
  instrumentation: "default-instrumentation"