image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-orders
  pullPolicy: IfNotPresent
  tag: ""

postgresql:
  create: false

rabbitmq:
  create: false

app:
  persistence:
    provider: postgres
    endpoint: "REPLACE_AFTER_TERRAFORM_APPLY:5432"
    database: "ordersdb"
    secret:
      create: false
      name: orders-db
      useSecretsManager: true
      secretsManager:
        secretName: "retailstore-db-secret-1"
        region: "ap-south-1"
  messaging:
    provider: sqs
    sqs:
      queueName: "retail-dev-orders-queue"
      region: "ap-south-1"
    rabbitmq:
      addresses: []
      secret:
        create: false

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  karpenter.sh/capacity-type: spot

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/instance: orders
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/instance: orders

podDisruptionBudget:
  enabled: false

opentelemetry:
  enabled: true
  instrumentation: "default-instrumentation"